# Persistent local installation; one-shot initialization services keep their own policies.
services:
  postgres:
    restart: unless-stopped
  supervisor:
    restart: unless-stopped
  api:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  web:
    restart: unless-stopped
    environment:
      RAKAZO_ALLOWED_HOSTS: ${RAKAZO_ALLOWED_HOSTS:-}
